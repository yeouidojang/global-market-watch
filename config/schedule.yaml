# 스케줄 트리거 설정 (KST 기준)
# APScheduler cron 표현식 사용

triggers:
  asia_close:
    hour: 16
    minute: 20
    label: "아시아 마감"
    session: asia

  global_close:
    hour: 6
    minute: 10
    label: "유럽+미국 통합 브리핑"
    sessions: [europe, us]   # europe 데이터/브리핑 컨텍스트 생성 → us에서 통합 Slack 발송

timezone: "Asia/Seoul"
